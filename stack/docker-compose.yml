# Central, self-hosted — the stack that replaces the managed Supabase project.
#
#   ./setup.py --domain central.example.com --fcm firebase-key.json
#   ./up.sh
#
# setup.py writes .env (every secret, generated) and the rendered config; up.sh
# starts everything and applies the migrations. Without --domain it is a local
# stack on 127.0.0.1:28000 with no TLS. See README.md beside this file.
#
# Every image is upstream and unmodified, at the versions rift-self-host pins,
# and each service is configured as it is there; the comments on the settings
# that bit are in that repository's docker-compose.yml and are not repeated.
# What differs is central's own: email sign-in and its templates, the
# authenticator codes the admin site needs and the lockout hook on them, and
# central's three edge functions.
#
# Kong is published on loopback in both modes, so scripts on the machine
# (`add_admin.sh`) reach the API without going out and back through TLS.

name: rift-central

services:
  kong:
    container_name: central-kong
    image: kong/kong:3.9.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KONG_PORT:-28000}:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    volumes:
      - ./volumes/api/kong.yml:/home/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      # Re-resolve the services every few seconds. Compose gives a recreated
      # container a new address — which happens whenever up.sh changes one's
      # settings — and Kong otherwise keeps the old one and answers 502 until
      # it is restarted itself.
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k

  auth:
    container_name: central-auth
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-}@db:5432/postgres

      # Where confirmation links land — the website, as on the hosted project
      # (README, "Auth settings").
      GOTRUE_SITE_URL: ${SITE_URL:-https://joinrift.app}
      GOTRUE_URI_ALLOW_LIST: ${URI_ALLOW_LIST:-https://joinrift.app/email-confirmation/}
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-}
      GOTRUE_JWT_KEYS: ${JWT_KEYS:-}

      # Accounts sign in with an email and password. Without SMTP there is
      # nothing to confirm with, so a local stack confirms on sign-up; the real
      # one turns this off and sets the SES settings below.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 6
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_SENDER:-no-reply@joinrift.app}
      GOTRUE_SMTP_SENDER_NAME: Rift
      # Coupled to the client and the templates: the templates say "one hour"
      # in words, and the app's resend cooldown is these same 60 seconds.
      GOTRUE_MAILER_OTP_EXP: 3600
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 30
      GOTRUE_MAILER_NOTIFICATIONS_PASSWORD_CHANGED_ENABLED: "true"
      # Links in the emails are API_EXTERNAL_URL plus these. Auth defaults to
      # a bare `/verify`, which is right for Auth on its own and a 404 behind
      # Kong, where it lives under /auth/v1.
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      # The emails themselves, from rift-website/email-templates — the source
      # of truth for them — served on the internal network by `mail-templates`
      # below. Auth fetches a template when it sends one.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://mail-templates/confirm-signup.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://mail-templates/reset-password.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://mail-templates/change-email.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://mail-templates/magic-link.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://mail-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: http://mail-templates/reauthentication.html
      GOTRUE_MAILER_TEMPLATES_PASSWORD_CHANGED_NOTIFICATION: http://mail-templates/password-changed.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirm your email
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Reset your Rift password
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Confirm your new address
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your sign-in link
      GOTRUE_MAILER_SUBJECTS_INVITE: You have been invited to Rift
      GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: Confirm it is you
      GOTRUE_MAILER_SUBJECTS_PASSWORD_CHANGED_NOTIFICATION: Your password was changed

      # The admin site's second factor (rift-admin). Central's moderation
      # functions refuse any session that has not passed it (`aal2`, 002).
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 10

      # Counts wrong codes per account and locks after five — see
      # `hook_mfa_verification_attempt` in 002. Supabase Auth's own limit on
      # code checks is per IP address and cannot be changed, and the managed
      # service offers this hook only on its Team plan and above.
      GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_ENABLED: "true"
      GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_URI: pg-functions://postgres/public/hook_mfa_verification_attempt

  rest:
    container_name: central-rest
    image: postgrest/postgrest:v16.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_POOL: 40
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_JWKS:-}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:-}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  realtime:
    # The name is parsed for the tenant id, so the subdomain part matters.
    container_name: realtime-dev.central-realtime
    image: supabase/realtime:v2.137.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sSfL --head -o /dev/null
          -H "Authorization: Bearer ${ANON_KEY:-}"
          http://localhost:4000/api/tenants/realtime-dev/health
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-}
      API_JWT_SECRET: ${JWT_SECRET:-}
      API_JWT_JWKS: ${JWT_JWKS:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      METRICS_JWT_SECRET: ${JWT_SECRET:-}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      REGION: us-east-1
      RLIMIT_NOFILE: "65536"
      APP_NAME: realtime
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
      # On only while the database has no tenant; up.sh decides.
      SEED_SELF_HOST: ${REALTIME_SEED:-false}

  storage:
    container_name: central-storage
    image: supabase/storage-api:v1.79.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY:-}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:-}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET:-}
      JWT_JWKS: ${JWT_JWKS:-}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${API_EXTERNAL_URL:-}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  functions:
    container_name: central-functions
    image: supabase/edge-runtime:v1.76.2
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      # One mount per function, so the runtime serves these three and nothing
      # else that might one day sit in that directory.
      - ./functions/main:/home/deno/functions/main:ro
      - ../supabase/functions/publish_server:/home/deno/functions/publish_server:ro
      - ../supabase/functions/push_send:/home/deno/functions/push_send:ro
      - ../supabase/functions/sweep_dm_attachments:/home/deno/functions/sweep_dm_attachments:ro
      - deno-cache:/root/.cache/deno
    # Only what the functions read. The router hands its whole environment to
    # every worker, so anything else put here — the database password, the
    # JWT secret — would be one bug in a function away from leaking.
    environment:
      SUPABASE_URL: http://kong:8000
      RIFT_SECRET_KEY: ${SECRET_KEY:-}
      PUSH_SECRET: ${PUSH_SECRET:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      ATTACHMENT_SWEEP_SECRET: ${ATTACHMENT_SWEEP_SECRET:-}
      VERIFY_JWT: "false"
    command: ["start", "--main-service", "/home/deno/functions/main"]

  # The email templates, for Auth to fetch. Internal only: nothing publishes a
  # port, and the files are the website repository's, read-only.
  mail-templates:
    container_name: central-mail-templates
    image: caddy:2.11-alpine
    restart: unless-stopped
    volumes:
      - ${EMAIL_TEMPLATES_DIR:-../../rift-website/email-templates}:/srv:ro
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":80"]

  # TLS in front of Kong. Only with a domain: `setup.py --domain` turns the
  # profile on (COMPOSE_PROFILES in .env).
  caddy:
    container_name: central-caddy
    image: caddy:2.11-alpine
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./volumes/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  db:
    container_name: central-db
    image: supabase/postgres:17.6.1.173
    restart: unless-stopped
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

volumes:
  db-data:
  db-config:
  storage-data:
  deno-cache:
  caddy-data:
  caddy-config:
