# Kong's declarative config for central. Kong fills in the doubled-brace
# placeholders itself at every start, from the keys in its environment
# (`kong_start.sh`), so this file holds no secret and is mounted as it is. The
# `$(...)` expressions are Kong's own and survive the filling in.
#
# Taken from rift-self-host's, which is trimmed from upstream's to the routes a
# client calls.
_format_version: "2.1"
_transform: true

###
### Who may call, and as what
###
### Two credentials per consumer. The `sb_publishable_` / `sb_secret_` pair is
### what clients are issued; the legacy JWT pair is still accepted so a client
### holding an older key keeps working. The request-transformer on each route
### below swaps an opaque key for the matching signed JWT before the request
### reaches the service, because only Kong knows the mapping — everything
### behind it verifies an ordinary JWT against the stack's JWKS.
###
consumers:
  - username: anon
    keyauth_credentials:
      - key: {{PUBLISHABLE_KEY}}
      - key: {{ANON_KEY}}
  - username: service_role
    keyauth_credentials:
      - key: {{SECRET_KEY}}
      - key: {{SERVICE_ROLE_KEY}}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

###
### Routes
###
services:
  ## Open: confirmation links land here with no key of their own.
  - name: auth-v1-open
    _comment: "Auth: /auth/v1/verify* -> http://auth:9999/verify*"
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors

  ## Open: anything verifying a session locally reads the public keys here.
  - name: auth-v1-open-jwks
    _comment: "Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json"
    url: http://auth:9999/.well-known/jwks.json
    routes:
      - name: auth-v1-open-jwks
        strip_path: true
        paths:
          - /auth/v1/.well-known/jwks.json
    plugins:
      - name: cors

  - name: auth-v1
    _comment: "Auth: /auth/v1/* -> http://auth:9999/*"
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '{{SECRET_KEY}}' and 'Bearer {{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (headers.apikey == '{{PUBLISHABLE_KEY}}' and 'Bearer {{ANON_KEY_ASYMMETRIC}}') or headers.apikey)"
          replace:
            headers:
              - "Authorization: $((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '{{SECRET_KEY}}' and 'Bearer {{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (headers.apikey == '{{PUBLISHABLE_KEY}}' and 'Bearer {{ANON_KEY_ASYMMETRIC}}') or headers.apikey)"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Accounts, DMs, backups and the directory, under the policies in 007.
  - name: rest-v1
    _comment: "PostgREST: /rest/v1/* -> http://rest:3000/*"
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '{{SECRET_KEY}}' and 'Bearer {{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (headers.apikey == '{{PUBLISHABLE_KEY}}' and 'Bearer {{ANON_KEY_ASYMMETRIC}}') or headers.apikey)"
          replace:
            headers:
              - "Authorization: $((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '{{SECRET_KEY}}' and 'Bearer {{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (headers.apikey == '{{PUBLISHABLE_KEY}}' and 'Bearer {{ANON_KEY_ASYMMETRIC}}') or headers.apikey)"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  - name: realtime-v1-ws
    _comment: "Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*"
    url: http://realtime-dev.central-realtime:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "x-api-key:$((query_params.apikey == '{{SECRET_KEY}}' and '{{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (query_params.apikey == '{{PUBLISHABLE_KEY}}' and '{{ANON_KEY_ASYMMETRIC}}') or query_params.apikey)"
          replace:
            querystring:
              - "apikey:$((query_params.apikey == '{{SECRET_KEY}}' and '{{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (query_params.apikey == '{{PUBLISHABLE_KEY}}' and '{{ANON_KEY_ASYMMETRIC}}') or query_params.apikey)"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Realtime's admin API, and the description of it, answered by Kong and
  ## never passed on. /api/tenants trusts any token signed with JWT_SECRET,
  ## and Storage signs every file link with that same secret, so a member
  ## holding one could suspend, delete or rewire Realtime from here. Upstream
  ## Supabase blocks both paths the same way. Kong matches the path after
  ## merging slashes, decoding and resolving dot segments, so "//tenants" or
  ## "x/../tenants" land here too. post-function, not request-termination,
  ## to match rift-self-host, whose servers may run an older compose file
  ## that does not load it.
  - name: realtime-v1-rest-tenants
    _comment: "Realtime: /realtime/v1/api/tenants/* (refused)"
    url: http://localhost:1
    routes:
      - name: realtime-v1-rest-tenants
        strip_path: true
        paths:
          - /realtime/v1/api/tenants
        plugins:
          - name: post-function
            config:
              access:
                - |
                    return kong.response.exit(403, { message = "Access is forbidden." })

  - name: realtime-v1-rest-openapi
    _comment: "Realtime: /realtime/v1/api/openapi/* (refused)"
    url: http://localhost:1
    routes:
      - name: realtime-v1-rest-openapi
        strip_path: true
        paths:
          - /realtime/v1/api/openapi
        plugins:
          - name: post-function
            config:
              access:
                - |
                    return kong.response.exit(403, { message = "Access is forbidden." })

  - name: realtime-v1-rest
    _comment: "Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*"
    url: http://realtime-dev.central-realtime:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '{{SECRET_KEY}}' and 'Bearer {{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (headers.apikey == '{{PUBLISHABLE_KEY}}' and 'Bearer {{ANON_KEY_ASYMMETRIC}}') or headers.apikey)"
          replace:
            headers:
              - "Authorization: $((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '{{SECRET_KEY}}' and 'Bearer {{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (headers.apikey == '{{PUBLISHABLE_KEY}}' and 'Bearer {{ANON_KEY_ASYMMETRIC}}') or headers.apikey)"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## No signed links into the two buckets of sealed bytes, made or used. A
  ## signed link needs no session to open, so one minted for a file in either
  ## was that file published from this domain for as long as the link said,
  ## ten years if asked. Nothing of Rift's makes one: the app downloads DM
  ## files and backups with its session, and the admin dashboard signs only
  ## directory icons and bug reports. The prefix covers both minting
  ## (POST /object/sign/<bucket>[/<path>]) and opening (GET with ?token=).
  - name: storage-v1-sign-sealed
    _comment: "Storage: signed links into backups and DM attachments (refused)"
    url: http://localhost:1
    routes:
      - name: storage-v1-sign-sealed
        strip_path: true
        paths:
          - /storage/v1/object/sign/backups
          - /storage/v1/object/sign/central-dm-attachments
        plugins:
          - name: post-function
            config:
              access:
                - |
                    return kong.response.exit(403, { message = "Access is forbidden." })

  ## DM attachments, vault backups and directory icons. No key-auth: a presigned URL carries its signature in the
  ## query string and no apikey header at all, and the post-function below drops
  ## the empty Authorization the transformer would otherwise leave behind.
  - name: storage-v1
    _comment: "Storage: /storage/v1/* -> http://storage:5000/*"
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '{{SECRET_KEY}}' and 'Bearer {{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (headers.apikey == '{{PUBLISHABLE_KEY}}' and 'Bearer {{ANON_KEY_ASYMMETRIC}}') or headers.apikey)"
          replace:
            headers:
              - "Authorization: $((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '{{SECRET_KEY}}' and 'Bearer {{SERVICE_ROLE_KEY_ASYMMETRIC}}') or (headers.apikey == '{{PUBLISHABLE_KEY}}' and 'Bearer {{ANON_KEY_ASYMMETRIC}}') or headers.apikey)"
      - name: post-function
        config:
          access:
            - |
                local auth = kong.request.get_header("authorization")
                if auth == nil or auth == "" or auth:find("^%s*$") then
                  kong.service.request.clear_header("authorization")
                end

  ## The functions. No key-auth, as on rift-self-host: `push_send` and
  ## `sweep_dm_attachments` are called with a shared secret and no API key,
  ## and each function checks its own caller. The database reaches them
  ## directly on the internal network, not through here.
  - name: functions-v1
    _comment: "Edge Functions: /functions/v1/* -> http://functions:9000/*"
    url: http://functions:9000/
    read_timeout: 150000
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
  ## `server_pass` on a route of its own, for a limit per address: it writes
  ## nothing down, so it cannot count an account's passes itself, and each one
  ## is a signature and a database read. Caddy sets the header (see Auth's
  ## GOTRUE_RATE_LIMIT_HEADER); a join asks once.
  - name: functions-v1-server-pass
    _comment: "Edge Functions: /functions/v1/server_pass -> http://functions:9000/server_pass"
    url: http://functions:9000/server_pass
    routes:
      - name: functions-v1-server-pass
        strip_path: true
        paths:
          - /functions/v1/server_pass
    plugins:
      - name: cors
      - name: rate-limiting
        config:
          minute: 20
          hour: 200
          policy: local
          limit_by: header
          header_name: X-Rift-Client-IP
